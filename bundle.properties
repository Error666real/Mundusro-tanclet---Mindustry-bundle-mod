sector.tarFields.description = The outskirts of an Evil red crux black gum production zone, between the tall stones and erekir. One of the few areas with usable black goop reserves.\nAlthough empty, this area has some dangerous Evil red crux forces nearby. Please K I L L them.\n\n[lightgray]Research black goop processing technology if possible.
sector.desolateRift.description = An extremely fucking smal zone. rich amout resources, but very fuckis small space. High risk of being killed. Build air and ground defenses as soon as possible. Please be cerfull by the 7 years spacing between Evil red crux attacks.
sector.nuclearComplex.description = A former facility for the power production and processing of strawbery flafoured uranium, exploded to shits.\n[lightgray]Research the [accent]strawberry flafoured uranium[] and its many uses.\n\nThe Evil red crux is present here in great numbers, constantly being rw player for attackers.
sector.fungalPass.description = A transition area between high mountains and lower, furry spore-ridden lands. A smol Evil red crux reconnaissance base is located here.\KILL it.\nUse orange units. Take out the Evil red crux chore.
sector.biomassFacility.description = The origin of fiurry spore. This is the facility in which they were lab and initially produced.\nResearch the technology contained within. Cultivate firry changing spore serume things to produce fuel and plastics.\n\n[lightgray]Upon this facility's demise, the furry spore was released. Nothing in the local ecosystem could compete with such a BASTARD organism.
sector.windsweptIslands.description = Further past the shoreline is this remote chain of islands. Records show they once had factories structures.\n\nFend off the VOC's naval units. Establish a base on the islands. Research these factories.
sector.extractionOutpost.description = A fucking litle outpost, constructed by the Evil red crux for the purpose of launching resources to other sectors.\n\nCross-sector transport technology is essential for further conquest. KILL the base. Research their launched Pads before they fly.
sector.impact0078.description = Here lie remnants of the alitle vessel that first entered this system.\n\nRecykel as much as possible from the wreckage. Research any intact technology.
sector.planetaryTerminal.description = The final target.\n\nThis bad Evil red crux base contains a structure capable of launching Cores to local world. It had no turret to be guarded.\n\nProduce boat units. KILL the Evil red crux as quickly as possible. Research the launched structure before it go to orange.
sector.coastline.description = Remnants of boat unit technology have been detected at this location. Repel the Evil red crux attacks, capture this sector, and acquire the captured wantek.
sector.navalFortress.description = The Evil red crux has established a base on a this litel ston, manually fortified island. kill this outpost. Acquire their advanced yamato boat technology and research it.

