status.asthosus-25y-02-memorial-recording-2.details = Despite their insane power and nerdness, the people of Astho Sus were not as smart dumbassly as other plenets in the solar sustem.\nThey had only just invented space travel.\n\nThey had alot of worries. Conflict and disease were but lot. The only type of shit that put a strain on the Astho Susans was the spicyness of the sun, for Astho Sus was comparatively close to it.
