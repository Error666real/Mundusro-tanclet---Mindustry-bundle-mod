sector.asthosus-19s-01-genesis.description = You spawned on Astho Sus and find yourself in a tight ravine devoid of life and things.\nCan you really hijack this planet?
sector.asthosus-19s-02-ignition.description = Small deposits of [accent]Coal: China Edition[] have formed via sus activity.\n\nStart to venture into electric bills.
sector.asthosus-19s-03-lattice.description = Scattered boulders of things dot the area.\nPrevent the Cruxahh from farming them.\nExpand quickly.\nUtilize [accent]Megnet Rock[] to defend against fatter foes.
sector.asthosus-19s-04-fulge.description = You land on a smol sekhtor.\nThis is the perfect opportunity to reserch and use [accent]Lithum[].\n\nSet up [accent]Lithum[] production. Nuke the Cruxahh on this sekhtor.\n\nA powerful geomagnetic stormrider is wrecking havoc here.\nIt appears to affect both you and the Cruxahh.\n\n\n[blue]Fun Fact but It's Shit:\n- Cruxahh deal 10% increased emotional damage.\n- Cruxahh have 25% more helth.\n- Your bildings have 15% less helth.
sector.asthosus-19s-05-immist.description = The Cruxahh has a fricking beis inside a shit area.\n\n Upon landing, they will attak you.\nDefend the core from Cruxahh fire.\n\nResearch person production technologias.\nNuke the Cruxahh beis.
sector.asthosus-19s-06-igneous-peaks.description = This sekhtor contains spicy lands.\nThese contain a new thing for you to use, [accent]Obsidina[].\n\nSummon [accent]Obsidina[] and use it to nuke this sector's fatass boss.
sector.asthosus-19s-07-detriment-valley.description = A sekhtor that has survived many little guys and fat mans.\nThe Cruxahh has gathered a stronk force here.\n\nVenture into spawning [accent]Barot[].\n\nCreate stronker defenses.\nNuke the Cruxahh in this sekhtor.\n\n\n[blue]Fun Fact but It's Shit:\n- Cruxahh have 15% more helth.\n- Cruxahh deal 15% more emotional damage.\n- Cruxahh move 10% faster.
sector.asthosus-19s-08-defringed-webbery.description = An old production complex lied here, idle for thousands of years.\nRespawn its self-heal capabilities. Utilize [accent]Vesmontok[] for defense.\n\nPlease be fooled by the large swarm spacing. This is a key site of Cruxahh interest.\n\n Utilize old, dead constructs left after each failed attempt to secure a foothold.\nDefeat the fatass boss that is "protecting" this sekhtor.\n\n\n[blue]Fun Fact but It's Shit:\n- Cruxahh are equipped with a sped boot. \n-Solar Spicer Paners are unavailable. \n-Deconstructing trash structures yields less things.
sector.asthosus-19s-09-synthesis-facility.description = The Cruxahh is cheating by approaching from two sides at the same time.\n\nVenture into the creation of [accent]Moldy Ahh Rock[].\nDefend and conquer this shit sekhtor.
sector.asthosus-19s-10-furnace-settlement.description = The Cruxahh has created an extremely fat beis here.\n\nFurthermore, the Cruxahh is deploying forces from two poop zones at the same time, again.\nSome of their most fat bosses have been ordered to put nuke to your campaign.\n\nVenture into the creation of [accent]Drugstem[].\nNuke the enemy swarms and nuke their fatass beis.
sector.asthosus-19s-11-omega.description = The last and final frontier.\n\nThe Cruxahh has gathered all remaining forces and will attak relentlessly.\n\nBe prepared to nuke back from multiple frontlines at the same time.\n\nThe enemy has secured their poop zones with a fatass beis.\n\nNuke this beis down.\nIt might be a dumb idea to first secure your own lands and production before lunching your attak.
sector.asthosus-20t-01-maar.description = You find yourself on a teeny ahh sekhtor with lots of [accent]Oasus Pee[].\n\nThis sekhtor shits itself perfectly for [accent]Magnetrock[] production.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-02-chasm.description = This sector may prove useful for additional [accent]Chinese Tololrium[] production.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-02-e-clamor.description = It appears this sector is reich in things.\n\nCruxahh fatass mens have been sighted.\n\nNuke them down. Claim this sector like the history of Baarle.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-02-f-embage.description = You find yourself on a very teenyahh and claustrophobic sector filled with denger.\n\nThe Cruxahh is shit.\nPush them back in the limited space provided.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-02-d-inferate.description = You stumble across a fatass beis.\n\nAfter you have captured [accent]Imist[], you wonder how many more beises you have to face.\n\nThe Cruxahh has built defenses in layers.\nNuke them down one by one.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-02-g-factory-unit-0047.description = One of the many obese factory units left \nthat were created by the Cruxahh. \n\nThis production complex lies like scrap, \nmost of it's defensive capabilities having nuked away. \n\nThe Cruxahh don't give a fuck on this unit.\n\n\n[blue]Fun Fact but It's Shit:\n- You can use stationary pew pew machines to attak the enemy beis.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-03-a-magmatic-riverbed.description = A vast your pee riverbed is housing in this area.\nEnormous sussy activities resulted in harsh terrain, proving most units being shit to attack.\n\nThe Cruxahh set up a fat, heavily protected outpost here.\n\n\n[blue]Fun Fact but It's Shit:\n- Only levitating people are usable.\n- Cruxahh bilding have 50% more helth.\n- Cruxahh deal 50% more emotional damage.\n- Your bildings have 20% more helth.\n- You bild 50% faster.\n- Your person production is 50% faster.\n- You can only deposit things into the kore.\n- Deconstructed bildings refund no things.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-03-barite-valley.description = You find yourself on a secret sector.\nThis sector seems to be home to weird, mutated creatures.\nThey appear to be somehow unorganic.\n\nSurvive the waves of weird creatures. Secure a foothold.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-03-c-lucila.description = Just when you got everything you need to summon [accent]Barot[], your [accent]Barot Kwern[] techonolgia somehow gets stolen by the Cruxahh.\n\nUtilize [accent]Barot Coolers[] to summon [accent]Barot[] instead.\nCreate fatter-tier peoples to nuke down the multiple beises here.\n\n\n[blue]Fun Fact but It's Shit:\n- Barot Kwerns are unavailable.\n- Utilize Barot Coolers to summon Barot.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-04-bioweapon-facility.description = A fat reserch facility that was hijacked by barot kriturs.\nIt once contained dangerous biological weapons.\n\nNow the hives control the entire beis.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-04-c-oasis-delta.description = Separated by a fat river of oasus pee, an untouched region lies separated from a fat Cruxahh beis.\n\nUtilize [accent]Vesmontok[] to create fath-tier people.\nBring this beis down.\n\nThe enemy will fight back with full power.\nBe prepared.\n\n\n[accent]Note: This is an optional sector. Capturing it is not required for completing the campaign.
sector.asthosus-20t-04-d-preciptum.description = Once a fatass area used for pew tests.\n\nA major part of this sectors terrain has been \nturned into a mysterious void by an insane kebum.\n\nThe Cruxahh has created a base on the remnants of this land.\n\nNuke it down.\n\n\n[blue]Fun Fact but It's Shit:\n- Cruxahh people deal 50% more damage.\n- Cruxahh bildings have 50% more helth.\n- Your person production is 50% slower.\n- Tug of War is present here.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-05-abandoned-research-center.description = The Cruxahh has created a mighty beis with multiple kores here.\nFatter tier people will be required to nuke it down.\n\nAct Fat. Expand quickly.\nTake down the Cruxahh beis before the enemy forces take you down.\n\n\n[blue]Fun Fact but It's Shit:\n- Cruxahh people deal 15% more emotional damage.\n- Cruxahh bildings have 25% more helth.\n- Cruxahh bildings deal 25% more emotional damage.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-05-b-thanatos.description = An outlying sector that contains alot of things considering its size.\n\nThe Cruxahh appears to have little presence here. Or do they...\n\nFight heaps of Cruxahh and fat mens.\nNuke this sekhtor for yourself.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-05-c-caldoria.description = Scans indicate that this sekhtor contains no [accent]Obsidina Crystals[].\n\nThe Cruxahh force cannot be calculated.\n\nNuke this sector for yourself.\n\n\n[blue]Fun Fact but It's Shit:\n- There are no Obsidina Cryxtals present.\n- Use Your Pee Cooling Molds to summon Obsidina.\n- Skinny-Tier Tech is unusable here.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-06-molten-heights.description = Due to massive amounts of pissing activity, the area is flooded with your pee.\nThe higher regions of the terrain remain untouched.\n\nThe enemy values this sekhtor greatly. Prepare for merciless swarms.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-06-n-mune.description = Units equipped with superbuffed shit generators have been sent to stop you.\n\nRetaliate with your most powerful pew pew machines.\n\n\n[blue]Fun Fact but It's Shit:\- Cruxahh deal 25% increased emotional damage from all sources.\n- Cruxahh possess a multitude of their helth as shields.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-06-o-inferno-bastion.description = This area is rich in things due to high pissing activity,\ndue to which the sector was flooded with heaps of your pee.\n\nEnemies have settled here long ago but were taken over by the barot kriturs.\n\nTake back the beis from these kriturs while avoiding the molten ass and bilding your infrastructure around it.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-06-p-nidus.description = Translated by [green]WantechFan[]\n\nA dangerous intelligence seems to be rallying an incredible amount of barot kriturs here, it is recommended to smash your pc into the burj khalifa.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-07-finistera.description = You land on a claustrophobic, teeny sector.\n\nThe Cruxahh has found great value in this sekhtor.\n\nThey are attacking from 4 directions.\nSome toilets will activate after a while, others will be active the entire time.\n\nA large population of [accent]Barot Kriturs[] is also present here.\nNuke down their hives.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.
sector.asthosus-20t-08-acropolis.description = You stumble upon a weirdahh shaped sekhtor.\n\nThe Cruxahh appears to have created the most powerful beise you have ever seen here.\n\nNuke it down. Fat-tier people will be required.\n\nIt appears that the beis is built in stages.\nPerhaps you should nuke the stages starting with the weakest one.\n\nConsider securing the limited space you have before nuking.\n\nExpand as much as you can.\n\n\n[accent]Note: This is a shit sector. Capturing it isn't required for completing the plenet.

