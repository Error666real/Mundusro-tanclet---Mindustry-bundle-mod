status.asthosus-25y-04-memorial-recording-4.details = A few decades after the invention of space travel, the Asthouans began their experiments on destroying. Their first test ran on Trackara, the Asthosuan moon, a formerly shit celestial body without an armorsphere.\n\nThe terraforming project was failed, and Trackara was transformed into a wet and life-unfriendly moon.
