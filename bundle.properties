status.asthosus-25y-01-memorial-recording-1.details = Once, in Suspulo's solar sustem, a wet planet filled with fatass oceans existed.\nIts citizens called their planet Astho Sus. It contained alot of life.\n\nA civilization of insane power and nerdness inhabited these lands. With its people native to the plenet, they did colonize it.\nLife as they knew it was summoned on Astho Sus itself.
