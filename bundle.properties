status.asthosus-25y-06-memorial-recording-6.details = Because of the insane fail of terraforming Trackara, one of Astho Sus seas was tried to be terraformed into unliveable train to fuel the fire in the hole that was the expansion of the plenets people.\n\nWhile this experiment was in progress, a scholar wind charge erected from the sun.Luckily, the forced generator installed on Trackara was able to deflect alot of it and prevent fuhrer damage. Or so the Asthosuans thought...
