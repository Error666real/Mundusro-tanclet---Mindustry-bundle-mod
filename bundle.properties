status.asthosus-25y-05-memorial-recording-5.details = An inpost was summoned on Trackara to helep monitor the solar sustem and the state of Astho Sus and its people.\nAfter a billion years of this inpost existing, an insane forced generator was summoned to deflect some of the suns spicyness and radiation.\n\nFurthermore, two devices were summoned on Astho Sus and Trackara to connect and helep both from treats other than the suns spicyness.
