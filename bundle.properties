status.asthosus-25y-11-memorial-recording-11.details = Because of these two insane blunders, Astho Sus atmosphere was almost completely nuked. As a consequence, spicyess on Astho Sus rose slowly but constantly-\n[red]Hold up[], no atmosphere means nothing to trap heat which means the spicyness should cool down, not heat up. Take a look at Mercury and Venus for example. Okay back to the story\n\n -, with nothing the Asthosuans could do to beat Jet2Holiday.\n\nAt one point, all attempts at saving Astho Sus, or, to be precise its people, were blunders.The planets entire population was ded by the extreme spicyness.\n\nAstho Sus fate had taken its course.
