status.asthosus-25y-09-memorial-recording-9.details = The Cruxahh made sure to summon weapons capable of ass destruction, should anyone come to threaten Astho Sus and its people.\n\nOne day, as a result of another plenets experiments, a crazy geomagnetic stormrider was released from the sun.\n\nThe stormrider hit Trackara first, nuking the final pieces of bildings that were still alive to protect Astho Sus. 
