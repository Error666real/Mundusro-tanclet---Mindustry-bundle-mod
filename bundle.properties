status.asthosus-25y-03-memorial-recording-3.details = The only type of shit the plenet constantly faced was a fight for power between two birthday parties. One party, known as the Shardedahh, believed that technologiacal advances brought but gud things.\nThey tried to advance research in all fields. The other party, the Cruxahh, thought that life on Astho Sus was better after inventing space travel and that it shouldn't return to that state.
