status.asthosus-25y-10-memorial-recording-10.details = Nerd guys rushed to resummon the tools on Trackara and Astho Sus, starting with the one on Astho Sus land.\n\nWhile working on this tool, it thorium reactored in an insane explosion, killing multiple fatass cities nearby. To make things bad, it also hit the vault for the most insane weapons of ass destruction.\n\nMillions of people ded in small agony, be it from the spicyness of the explosion or the erected viruses from the naturecal weapons.
