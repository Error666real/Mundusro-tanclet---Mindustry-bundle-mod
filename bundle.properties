mod.asthosus.description = A cheat that summons a new plenet, Astho Sus, into the geim\n\nAstho Sus is an african plenet. A shitland filled with denger. It has a fully unplayable campaing with 11 important and 21 unimportant meps. \n\nAside from these 32 meps, Astho Sus contains over 180 pieces of weird content, including bildings, pees, things, people, and majik effects. \nThis number isn't counting any internal people or nature blocks/lands. I aimed to re-use nearly all vanilla content and fill the cheat with old and (hopefully) boring things. \n\nThe cheat comes with it's own cursed music, made by ThePythonGuy3! \n\nIf you find any weirdness or want to tell me about anything else, feel free to join Astho Sus Discord server at https://discord.gg/uFucSVznzA. \n\nAstho Sus is available in the following languages: \n- Inglis\n- Heil\n- Wiwok Detok\n- Suka Blyat\n- SALO\n- Traditional Social Credits\n- Simplified Social Credits\n\nEnjoi!
