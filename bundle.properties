status.asthosus-25y-07-memorial-recording-7.details = A fatass part of the flare's scholar energy managed to escape the forced shit, directly attaking the terraforming devices on both Astho Sus and Trackara.\n\nThe machines went crazy and threatened to nuke a private part of the Asthosian civilization.\n\nLuckily, though, the nerd scientists were able to escape this shit moments by abandoning the terraforming tools into outer spaceeee, last minut, where they went into a bang.\n\nThis blunder was the final straw the Cruxahh party needed to finally hijack and take power over Astho Sus. 
